apply plugin: 'com.android.application'

// Pays de l'application : même variable que le build web, `fr` par défaut. Voir docs/admob.md.
def geoCountry = System.getenv('GEO_COUNTRY') ?: 'fr'
def geoAndroid = new groovy.json.JsonSlurper().parse(rootProject.file("../content/${geoCountry}/android.json"))
// Tant que Christian n'a pas validé les annonces réelles, seul l'éditeur de démonstration de Google est accepté.
if (!geoAndroid.admobAppId.startsWith('ca-app-pub-3940256099942544~')) {
    throw new GradleException("ID d'application AdMob refusé : seul l'ID de démonstration Google est autorisé")
}

// Clé d'envoi Google Play : elle et ses mots de passe restent hors du dépôt. Le fichier de réglages est lu dans
// GEOFR_KEYSTORE_PROPERTIES, sinon dans %USERPROFILE%\.geofr\keystore.properties. Sans lui, l'AAB n'est pas signé.
// Voir docs/admob.md, section Clé d'envoi.
def uploadKeyFile = file(System.getenv('GEOFR_KEYSTORE_PROPERTIES') ?: "${System.getProperty('user.home')}/.geofr/keystore.properties")
def uploadKey = new Properties()
if (uploadKeyFile.exists()) {
    uploadKeyFile.withInputStream { uploadKey.load(it) }
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { name ->
        if (!uploadKey.getProperty(name)) {
            throw new GradleException("Clé d'envoi : « ${name} » manque dans ${uploadKeyFile}")
        }
    }
}

android {
    namespace = "fr.javachrist.geofr"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId geoAndroid.applicationId
        manifestPlaceholders = [admobAppId: geoAndroid.admobAppId]
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 7
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Photos : pack d'assets Play en install-time dans le bundle (AAB). Un APK de débogage installé hors
    // Play ne reçoit pas les packs, il embarque donc les mêmes fichiers dans ses assets pour les tests.
    assetPacks = [":media_pack"]
    sourceSets {
        debug {
            assets.srcDirs += ['../media_pack/src/main/assets']
        }
    }
    signingConfigs {
        if (uploadKeyFile.exists()) {
            upload {
                storeFile file(uploadKey.getProperty('storeFile'))
                storePassword uploadKey.getProperty('storePassword')
                keyAlias uploadKey.getProperty('keyAlias')
                keyPassword uploadKey.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            if (uploadKeyFile.exists()) {
                signingConfig signingConfigs.upload
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "com.android.billingclient:billing:$playBillingVersion"
    implementation "androidx.credentials:credentials:$androidxCredentialsVersion"
    implementation "androidx.credentials:credentials-play-services-auth:$androidxCredentialsVersion"
    implementation "com.google.android.libraries.identity.googleid:googleid:$googleIdVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
